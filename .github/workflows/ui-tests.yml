name: Selenium UI tests

on:
  pull_request:
    branches: [main]
    types: [opened]
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:
    inputs:
      suite:
        description: Selenium test suite to run
        required: true
        default: smoke
        type: choice
        options:
          - smoke
          - regression
          - e2e
          - all

permissions:
  contents: read

jobs:
  ui-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Set up Java for Allure
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Poetry
        run: pipx install poetry==2.4.1

      - name: Install project dependencies
        run: poetry install

      - name: Install Allure command line
        run: npm install --global allure-commandline@2.43.0

      - name: Select Selenium tests
        id: selection
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_SUITE: ${{ inputs.suite }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "schedule" ]]; then
            echo "mode=marker" >> "${GITHUB_OUTPUT}"
            echo "marker=smoke" >> "${GITHUB_OUTPUT}"
            echo "run_tests=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${MANUAL_SUITE}" == "all" ]]; then
              echo "mode=all" >> "${GITHUB_OUTPUT}"
            else
              echo "mode=marker" >> "${GITHUB_OUTPUT}"
              echo "marker=${MANUAL_SUITE}" >> "${GITHUB_OUTPUT}"
            fi
            echo "run_tests=true" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          diff_range="${PR_BASE_SHA}...${PR_HEAD_SHA}"
          mapfile -t changed_tests < <(
            git diff --name-only --diff-filter=ACMR "${diff_range}" -- "tests/**/test_*.py"
          )

          framework_changed=false
          framework_paths=(src config tests/conftest.py pytest.ini pyproject.toml)
          if ! git diff --quiet "${diff_range}" -- "${framework_paths[@]}"; then
            framework_changed=true
          fi

          test_targets=()
          for test_path in "${changed_tests[@]}"; do
            if [[ "${framework_changed}" == "true" && "${test_path}" == tests/smoke/* ]]; then
              continue
            fi
            test_targets+=("${test_path}")
          done

          if [[ "${framework_changed}" == "true" ]]; then
            test_targets+=("tests/smoke")
          fi

          if (( ${#test_targets[@]} == 0 )); then
            echo "mode=skip" >> "${GITHUB_OUTPUT}"
            echo "run_tests=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          printf "%s\n" "${test_targets[@]}" > .ci-test-targets
          echo "mode=targets" >> "${GITHUB_OUTPUT}"
          echo "run_tests=true" >> "${GITHUB_OUTPUT}"

      - name: Report no affected Selenium tests
        if: steps.selection.outputs.run_tests == 'false'
        run: echo "No affected Selenium tests were found for this pull request."

      - name: Run selected Selenium UI tests
        if: steps.selection.outputs.run_tests == 'true'
        shell: bash
        env:
          SELECTION_MODE: ${{ steps.selection.outputs.mode }}
          TEST_MARKER: ${{ steps.selection.outputs.marker }}
        run: |
          set -euo pipefail
          common_args=(--headless --clean-alluredir --alluredir=allure-results)

          case "${SELECTION_MODE}" in
            all)
              poetry run pytest "${common_args[@]}"
              ;;
            marker)
              poetry run pytest -m "${TEST_MARKER}" "${common_args[@]}"
              ;;
            targets)
              mapfile -t test_targets < .ci-test-targets
              poetry run pytest "${test_targets[@]}" "${common_args[@]}"
              ;;
            *)
              echo "Unsupported test selection mode: ${SELECTION_MODE}" >&2
              exit 1
              ;;
          esac

      - name: Generate Allure report
        if: ${{ always() && hashFiles('allure-results/**') != '' }}
        run: allure generate allure-results --clean --output allure-report

      - name: Upload Selenium test artifacts
        if: ${{ always() && hashFiles('allure-results/**') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: selenium-allure-${{ github.event_name }}-${{ github.run_number }}
          path: |
            allure-report/
            allure-results/
            screenshots/
            logs/
          if-no-files-found: warn
