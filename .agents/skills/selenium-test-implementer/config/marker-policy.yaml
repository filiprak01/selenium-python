version: 1

# Marks applied to every test generated by this skill.
# Add another repository-wide mandatory mark here once it is registered in pytest.
required_for_all:
  - ui
  - regression

# Marks derived from the accepted manual testcase classification.
derived:
  type:
    Smoke:
      - smoke
    Regression: []
  scope:
    Feature: []
    E2E:
      - e2e

# Frontmatter fields used by the two skills.
additional_marks_field: additional_pytest_marks
resolved_marks_field: automation_marks

# Controls deterministic decorator order in generated code and documentation.
# Marks not listed here are appended in their resolved order.
preferred_order:
  - ui
  - regression
  - smoke
  - e2e

rules:
  preserve_compatible_existing_marks: true
  deduplicate: true
  require_registration: true
  reject_invalid_marker_names: true

# Default descriptions are suggestions for missing registration entries.
# Preserve existing repository descriptions when a marker is already registered.
descriptions:
  ui: Selenium browser user-interface automation
  regression: Maintained regression coverage
  smoke: Critical confidence subset of regression coverage
  e2e: End-to-end workflow crossing meaningful functional boundaries
